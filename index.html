<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist</title>
    <style>
      #wishlist li {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>My Wishlist</h1>

    <ul id="wishlist"></ul>
    <p id="empty-msg" hidden>Your wishlist is empty.</p>

    <form id="add-form">
      <h2>Add an Item</h2>
      <label>
        Name:
        <input type="text" id="input-name" required />
      </label>
      <label>
        URL:
        <input type="url" id="input-url" required />
      </label>
      <label>
        Image URL (optional):
        <input type="url" id="input-image" />
      </label>
      <label>
        Price:
        <input type="number" id="input-price" min="0" step="0.01" required />
      </label>
      <label>
        Qty:
        <input type="number" id="input-qty" min="1" value="1" required />
      </label>
      <button type="submit">Add to Wishlist</button>
    </form>

    <script>
      const DEFAULT_ITEMS = [
        {
          name: "Kindle Paperwhite",
          url: "https://www.amazon.com/dp/B08KTZ8249",
          image: "https://m.media-amazon.com/images/I/61pla6j-YQL._AC_SL1500_.jpg",
          price: 139.99,
          quantity: 1,
        },
      ];

      const saved = localStorage.getItem("wishlist");
      const items = saved ? JSON.parse(saved) : DEFAULT_ITEMS;

      function save() {
        localStorage.setItem("wishlist", JSON.stringify(items));
      }

      function render() {
        const list = document.getElementById("wishlist");
        const emptyMsg = document.getElementById("empty-msg");
        list.innerHTML = "";

        if (items.length === 0) {
          emptyMsg.hidden = false;
          return;
        }
        emptyMsg.hidden = true;

        items.forEach(function (item, index) {
          const li = document.createElement("li");

          if (item.image) {
            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.name;
            img.width = 80;
            li.appendChild(img);
          }

          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = item.name;
          li.appendChild(a);

          const priceSpan = document.createElement("span");
          priceSpan.textContent = "Price: $" + item.price.toFixed(2);
          li.appendChild(priceSpan);

          const qtySpan = document.createElement("span");
          qtySpan.textContent = "Qty: " + item.quantity;
          li.appendChild(qtySpan);

          const btn = document.createElement("button");
          btn.textContent = "Delete";
          btn.dataset.index = index;
          li.appendChild(btn);

          list.appendChild(li);
        });
      }

      render();

      document.getElementById("wishlist").addEventListener("click", function (event) {
        if (event.target.tagName === "BUTTON") {
          const index = parseInt(event.target.dataset.index, 10);
          items.splice(index, 1);
          save();
          render();
        }
      });

      document.getElementById("add-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const name  = document.getElementById("input-name").value.trim();
        const url   = document.getElementById("input-url").value.trim();
        const image = document.getElementById("input-image").value.trim();

        const priceInput = document.getElementById("input-price");
        const price = parseFloat(priceInput.value);
        if (isNaN(price) || price < 0) {
          priceInput.setCustomValidity("Please enter a valid price (numbers only, 0 or greater).");
          priceInput.reportValidity();
          return;
        }
        priceInput.setCustomValidity("");

        const qtyInput = document.getElementById("input-qty");
        const quantity = parseInt(qtyInput.value, 10);
        if (isNaN(quantity) || quantity < 1) {
          qtyInput.setCustomValidity("Quantity must be at least 1.");
          qtyInput.reportValidity();
          return;
        }
        qtyInput.setCustomValidity("");

        items.push({ name, url, image, price, quantity });
        save();
        render();

        event.target.reset();
      });
    </script>
  </body>
</html>
