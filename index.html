<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist</title>
    <style>
      #wishlist li {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      #wishlist input[type="number"] {
        width: 70px;
      }
    </style>
  </head>
  <body>
    <h1>My Wishlist</h1>

    <ul id="wishlist"></ul>
    <p id="empty-msg" hidden>Your wishlist is empty.</p>
    <p id="total"></p>

    <form id="add-form">
      <h2>Add an Item</h2>
      <label>
        Name:
        <input type="text" id="input-name" required />
      </label>
      <label>
        URL:
        <input type="url" id="input-url" required />
      </label>
      <label>
        Image URL (optional):
        <input type="url" id="input-image" />
      </label>
      <label>
        Price:
        <input type="number" id="input-price" min="0" step="0.01" required />
      </label>
      <label>
        Qty:
        <input type="number" id="input-qty" min="1" value="1" required />
      </label>
      <button type="submit">Add to Wishlist</button>
    </form>

    <script>
      // --- Validation helpers ---

      function isValidUrl(str) {
        try {
          const url = new URL(str);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      // Product names: must start with a letter or digit, allow letters, digits,
      // spaces, and common punctuation ( - ' ( ) , & . ! )
      const NAME_PATTERN = /^[a-zA-Z0-9][a-zA-Z0-9\s\-'(),&.!]*$/;

      // Price: one or more digits, optionally followed by a dot and 1–2 digits
      const PRICE_PATTERN = /^\d+(\.\d{1,2})?$/;

      // --- localStorage helpers ---

      const DEFAULT_ITEMS = [
        {
          name: "Kindle Paperwhite",
          url: "https://www.amazon.com/dp/B08KTZ8249",
          image: "https://m.media-amazon.com/images/I/61pla6j-YQL._AC_SL1500_.jpg",
          price: 139.99,
          quantity: 1,
        },
      ];

      function loadItems() {
        try {
          const saved = localStorage.getItem("wishlist");
          if (saved) {
            const parsed = JSON.parse(saved);
            // Sanitize: coerce price/quantity to numbers in case localStorage was corrupted
            return parsed.map(function (item) {
              const price = Math.round(Number(item.price) * 100) / 100;
              const quantity = Math.max(1, parseInt(item.quantity, 10) || 1);
              return { ...item, price: isNaN(price) ? 0 : price, quantity };
            });
          }
        } catch {
          // localStorage unavailable or data was corrupted
        }
        return [...DEFAULT_ITEMS];
      }

      function save() {
        try {
          localStorage.setItem("wishlist", JSON.stringify(items));
        } catch {
          // localStorage unavailable, silently skip
        }
      }

      const items = loadItems();

      // --- Total ---
      // Computes in integer cents to avoid floating-point drift (e.g. 0.1 + 0.2 = 0.30000000000000004)

      function updateTotal() {
        const totalCents = items.reduce(function (sum, item) {
          return sum + Math.round(item.price * 100) * item.quantity;
        }, 0);
        document.getElementById("total").textContent =
          "Total: $" + (totalCents / 100).toFixed(2);
      }

      // --- Render ---

      function render() {
        const list = document.getElementById("wishlist");
        const emptyMsg = document.getElementById("empty-msg");
        list.innerHTML = "";
        updateTotal();

        if (items.length === 0) {
          emptyMsg.hidden = false;
          return;
        }
        emptyMsg.hidden = true;

        items.forEach(function (item, index) {
          const li = document.createElement("li");

          if (item.image) {
            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.name;
            img.width = 80;
            img.onerror = function () { this.hidden = true; };
            li.appendChild(img);
          }

          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = item.name;
          li.appendChild(a);

          const priceLabel = document.createElement("label");
          priceLabel.textContent = "Price: $";
          const priceInput = document.createElement("input");
          priceInput.type = "number";
          priceInput.min = "0";
          priceInput.step = "0.01";
          priceInput.value = item.price.toFixed(2);
          priceInput.dataset.index = index;
          priceInput.dataset.field = "price";
          priceLabel.appendChild(priceInput);
          li.appendChild(priceLabel);

          const qtyLabel = document.createElement("label");
          qtyLabel.textContent = "Qty: ";
          const qtyInput = document.createElement("input");
          qtyInput.type = "number";
          qtyInput.min = "1";
          qtyInput.value = item.quantity;
          qtyInput.dataset.index = index;
          qtyInput.dataset.field = "quantity";
          qtyLabel.appendChild(qtyInput);
          li.appendChild(qtyLabel);

          const btn = document.createElement("button");
          btn.textContent = "Delete";
          btn.dataset.index = index;
          li.appendChild(btn);

          list.appendChild(li);
        });
      }

      render();

      // --- Delete ---

      document.getElementById("wishlist").addEventListener("click", function (event) {
        if (event.target.tagName === "BUTTON") {
          const index = parseInt(event.target.dataset.index, 10);
          items.splice(index, 1);
          save();
          render();
        }
      });

      // --- Inline edit (price / qty) ---
      // Uses "change" (fires on blur/Enter) rather than "input" to avoid saving on every keystroke.
      // Does NOT call render() — that would destroy the focused input — only updates the total.

      document.getElementById("wishlist").addEventListener("change", function (event) {
        const el = event.target;
        if (el.tagName !== "INPUT") return;
        const index = parseInt(el.dataset.index, 10);
        if (isNaN(index)) return;

        if (el.dataset.field === "price") {
          const val = Math.round(parseFloat(el.value) * 100) / 100;
          if (isNaN(val) || val < 0) {
            el.value = items[index].price.toFixed(2); // revert bad input
            return;
          }
          items[index].price = val;
          el.value = val.toFixed(2); // normalise display (e.g. "1" → "1.00")
        } else if (el.dataset.field === "quantity") {
          const val = parseInt(el.value, 10);
          if (isNaN(val) || val < 1) {
            el.value = items[index].quantity; // revert bad input
            return;
          }
          items[index].quantity = val;
        }

        save();
        updateTotal();
      });

      // --- Add item ---

      document.getElementById("add-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const nameInput  = document.getElementById("input-name");
        const urlInput   = document.getElementById("input-url");
        const imageInput = document.getElementById("input-image");
        const priceInput = document.getElementById("input-price");
        const qtyInput   = document.getElementById("input-qty");

        // Clear any stale error messages from a previous submission
        [nameInput, urlInput, imageInput, priceInput, qtyInput].forEach(function (el) {
          el.setCustomValidity("");
        });

        const name  = nameInput.value.trim();
        const url   = urlInput.value.trim();
        const image = imageInput.value.trim();

        if (!NAME_PATTERN.test(name)) {
          nameInput.setCustomValidity(
            "Name must start with a letter or number and contain only standard characters."
          );
          nameInput.reportValidity();
          return;
        }

        if (!isValidUrl(url)) {
          urlInput.setCustomValidity("Please enter a valid URL starting with http:// or https://");
          urlInput.reportValidity();
          return;
        }

        if (image && !isValidUrl(image)) {
          imageInput.setCustomValidity("Please enter a valid image URL starting with http:// or https://");
          imageInput.reportValidity();
          return;
        }

        const priceStr = priceInput.value.trim();
        if (!PRICE_PATTERN.test(priceStr)) {
          priceInput.setCustomValidity("Price must be a number with up to 2 decimal places (e.g. 9.99).");
          priceInput.reportValidity();
          return;
        }
        const price = parseFloat(priceStr);

        const quantity = parseInt(qtyInput.value, 10);
        if (isNaN(quantity) || quantity < 1) {
          qtyInput.setCustomValidity("Quantity must be at least 1.");
          qtyInput.reportValidity();
          return;
        }

        items.push({ name, url, image, price, quantity });
        save();
        render();

        event.target.reset();
      });
    </script>
  </body>
</html>
