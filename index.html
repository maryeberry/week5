<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist</title>
  </head>
  <body>
    <h1>My Wishlist</h1>

    <ul id="wishlist"></ul>

    <form id="add-form">
      <h2>Add an Item</h2>
      <label>
        Name:
        <input type="text" id="input-name" required />
      </label>
      <label>
        URL:
        <input type="url" id="input-url" required />
      </label>
      <label>
        Image URL:
        <input type="url" id="input-image" required />
      </label>
      <label>
        Price:
        <input type="number" id="input-price" min="0" step="0.01" required />
      </label>
      <label>
        Qty:
        <input type="number" id="input-qty" min="1" value="1" required />
      </label>
      <button type="submit">Add to Wishlist</button>
    </form>

    <script>
      const items = [
        {
          name: "Kindle Paperwhite",
          url: "https://www.amazon.com/dp/B08KTZ8249",
          image: "https://m.media-amazon.com/images/I/61pla6j-YQL._AC_SL1500_.jpg",
          price: 139.99,
          quantity: 1,
        },
      ];

      function render() {
        const list = document.getElementById("wishlist");
        list.innerHTML = "";

        items.forEach(function (item, index) {
          const li = document.createElement("li");
          li.innerHTML = `
            <img src="${item.image}" alt="${item.name}" width="80" />
            <a href="${item.url}" target="_blank">${item.name}</a>
            <span>Price: $${item.price}</span>
            <span>Qty: ${item.quantity}</span>
            <button data-index="${index}">Delete</button>
          `;
          list.appendChild(li);
        });
      }

      render();

      document.getElementById("wishlist").addEventListener("click", function (event) {
        if (event.target.tagName === "BUTTON") {
          const index = parseInt(event.target.dataset.index, 10);
          items.splice(index, 1);
          render();
        }
      });

      document.getElementById("add-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const name  = document.getElementById("input-name").value.trim();
        const url   = document.getElementById("input-url").value.trim();
        const image = document.getElementById("input-image").value.trim();
        const price = parseFloat(document.getElementById("input-price").value);
        const quantity = parseInt(document.getElementById("input-qty").value, 10);

        items.push({ name, url, image, price, quantity });
        render();

        event.target.reset();
      });
    </script>
  </body>
</html>
